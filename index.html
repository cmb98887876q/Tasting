<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Video Player</title>
    <!-- Google Fonts & FontAwesome for Modern Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f111a;
            --surface-color: rgba(26, 31, 44, 0.7);
            --surface-solid: #1a1f2c;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ef4444;
            --download-color: #10b981;
            --download-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(99, 102, 241, 0.25);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animated Glows */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(140px);
            border-radius: 50%;
            z-index: -1;
            top: -50px;
            left: 10%;
            opacity: 0.3;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: #ec4899;
            filter: blur(160px);
            border-radius: 50%;
            z-index: -1;
            bottom: -50px;
            right: 10%;
            opacity: 0.2;
            animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.35; }
        }

        /* Container & Glassmorphism */
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 1;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: var(--transition);
        }

        /* Input Group */
        .input-group-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container i.fa-link {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 1rem;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 17, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px 14px 48px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--glow-color);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        /* Action Buttons Row */
        .actions-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button, .btn-link-action {
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            border-radius: 10px;
            padding: 10px 16px;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            flex: 1;
            justify-content: center;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-download {
            background-color: var(--download-color);
            color: white;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            justify-content: center;
        }

        .btn-download:hover {
            background-color: var(--download-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Error Feedback */
        .error-message {
            display: none;
            color: var(--accent);
            font-size: 0.85rem;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Player Section */
        .player-section {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.4s ease;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Player Option Controls */
        .player-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            justify-content: center;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            color: var(--text-main);
        }

        .btn-control i {
            color: var(--primary);
        }

        .btn-control.download-control i {
            color: var(--download-color);
        }

        .btn-control.download-control:hover {
            border-color: var(--download-color);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        .toast {
            background: var(--surface-solid);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.3s ease 2.7s forwards;
        }

        .toast.success i { color: #10b981; }
        .toast.error i { color: var(--accent); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(10px); }
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            body { padding: 12px; }
            header h1 { font-size: 1.8rem; }
            .card { padding: 16px; }
            .actions-row { flex-direction: column; }
            .btn-primary, .btn-secondary, .btn-download { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <header>
            <h1>External Video Player</h1>
            <p>Seamlessly embed, open, and download YouTube videos across web and mobile.</p>
        </header>

        <!-- Input Card -->
        <div class="card">
            <div class="input-group-wrapper">
                <div class="input-container">
                    <i class="fa-solid fa-link"></i>
                    <input type="text" id="urlInput" placeholder="Paste YouTube URL here (e.g., https://youtu.be/...)" autocomplete="off" spellcheck="false">
                </div>
                
                <div class="error-message" id="errorMessage">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText">Please enter a valid YouTube video link.</span>
                </div>

                <div class="actions-row">
                    <button class="btn-secondary" id="pasteBtn" title="Paste from clipboard">
                        <i class="fa-solid fa-paste"></i> Paste
                    </button>
                    <button class="btn-secondary" id="copyBtn" title="Copy video URL">
                        <i class="fa-solid fa-copy"></i> Copy
                    </button>
                    <button class="btn-download" id="downloadMainBtn" title="Download video link">
                        <i class="fa-solid fa-download"></i> Download
                    </button>
                    <button class="btn-primary" id="playBtn">
                        <i class="fa-solid fa-play"></i> Play
                    </button>
                </div>
            </div>
        </div>

        <!-- Player Card Section -->
        <div class="card player-section" id="playerSection">
            <div class="video-wrapper">
                <iframe id="youtubeIframe" src="" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>

            <!-- Alternative Playback & Download Controls -->
            <div class="player-controls">
                <a href="#" id="downloadAppBtn" class="btn-control download-control" target="_blank" rel="noopener noreferrer">
                    <i class="fa-solid fa-download"></i> Download Video
                </a>
                <a href="#" id="externalAppBtn" class="btn-control" target="_blank" rel="noopener noreferrer">
                    <i class="fa-solid fa-mobile-screen-button"></i> Open in App
                </a>
                <a href="#" id="pipBtn" class="btn-control" target="_blank" rel="noopener noreferrer">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Original Link
                </a>
                <button class="btn-control" id="clearBtn" style="border: none; cursor: pointer;">
                    <i class="fa-solid fa-rotate-right"></i> Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script>
        // DOM Elements
        const urlInput = document.getElementById('urlInput');
        const pasteBtn = document.getElementById('pasteBtn');
        const copyBtn = document.getElementById('copyBtn');
        const playBtn = document.getElementById('playBtn');
        const downloadMainBtn = document.getElementById('downloadMainBtn');
        const clearBtn = document.getElementById('clearBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const playerSection = document.getElementById('playerSection');
        const youtubeIframe = document.getElementById('youtubeIframe');
        const externalAppBtn = document.getElementById('externalAppBtn');
        const downloadAppBtn = document.getElementById('downloadAppBtn');
        const pipBtn = document.getElementById('pipBtn');
        const toastContainer = document.getElementById('toast-container');

        // Helper function to show notifications (Toast)
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Robust YouTube URL Parser & Validator
        function extractVideoId(url) {
            if (!url) return null;
            const cleanedUrl = url.trim();
            
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = cleanedUrl.match(regExp);

            return (match && match[2].length === 11) ? match[2] : null;
        }

        function validateAndGetId() {
            const val = urlInput.value.trim();
            if (!val) {
                showError("Please enter or paste a YouTube video URL.");
                return null;
            }

            const videoId = extractVideoId(val);
            if (!videoId) {
                showError("Invalid YouTube URL. Please use standard or youtu.be links.");
                return null;
            }

            hideError();
            return videoId;
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorMessage.style.display = 'flex';
            urlInput.style.borderColor = 'var(--accent)';
        }

        function hideError() {
            errorMessage.style.display = 'none';
            urlInput.style.borderColor = 'var(--border-color)';
        }

        // Paste Button Handler
        pasteBtn.addEventListener('click', async () => {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    urlInput.value = text;
                    hideError();
                    showToast("URL pasted from clipboard!");
                } else {
                    showToast("Clipboard permission not granted or supported.", "error");
                }
            } catch (err) {
                showError("Unable to paste from clipboard. Please paste manually.");
            }
        });

        // Copy Button Handler
        copyBtn.addEventListener('click', () => {
            const val = urlInput.value.trim();
            if (!val) {
                showError("Nothing to copy!");
                return;
            }
            navigator.clipboard.writeText(val).then(() => {
                showToast("Video URL copied to clipboard!");
            }).catch(() => {
                showToast("Failed to copy URL.", "error");
            });
        });

        // Download Button Handlers
        function handleDownload() {
            const videoId = validateAndGetId();
            if (!videoId) return;

            // Secure external redirection URL handler compatible with standard download resolvers/services
            const fullUrl = `https://www.youtube.com/watch?v=${videoId}`;
            const downloadServiceUrl = `https://ssyoutube.com/watch?v=${videoId}`; // Or similar auxiliary safe utility
            
            window.open(downloadServiceUrl, '_blank', 'noopener,noreferrer');
            showToast("Redirecting to video download service...");
        }

        downloadMainBtn.addEventListener('click', handleDownload);

        // Play Video Button Handler
        playBtn.addEventListener('click', () => {
            const videoId = validateAndGetId();
            if (!videoId) return;

            const originalHTML = playBtn.innerHTML;
            playBtn.innerHTML = `<div class="spinner"></div> Loading...`;
            playBtn.disabled = true;

            setTimeout(() => {
                // Set Embedded Player Source
                youtubeIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
                
                // Configure Actions and Links
                externalAppBtn.href = `vnd.youtube://${videoId}`;
                downloadAppBtn.href = `https://ssyoutube.com/watch?v=${videoId}`;
                pipBtn.href = `https://www.youtube.com/watch?v=${videoId}`;

                // Display player section
                playerSection.style.display = 'flex';
                playBtn.innerHTML = originalHTML;
                playBtn.disabled = false;

                playerSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                showToast("Video loaded successfully!");
            }, 350);
        });

        // Reset/Clear Player
        clearBtn.addEventListener('click', () => {
            youtubeIframe.src = '';
            playerSection.style.display = 'none';
            urlInput.value = '';
            hideError();
            showToast("Player reset.");
        });

        // Enter key shortcut trigger
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                playBtn.click();
            }
        });

        // Real-time input cleaning
        urlInput.addEventListener('input', () => {
            if (errorMessage.style.display === 'flex') {
                hideError();
            }
        });
    </script>
</body>
</html>
