<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Photo Viewer</title>
    
    <!-- PWA Manifest Encoded Directly into the HTML (No external file needed) -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Pro%20Photo%20Viewer%22%2C%22short_name%22%3A%22ProPhoto%22%2C%22description%22%3A%22Premium%20High-quality%20offline%20photo%20viewing.%20Secured%20with%20PIN.%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2305050A%22%2C%22theme_color%22%3A%22%236366f1%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fupload.wikimedia.org%2Fwikipedia%2Fcommons%2Fthumb%2Fe%2Fe0%2FPlaceholder_icon_-_camera.svg%2F192px-Placeholder_icon_-_camera.svg.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fupload.wikimedia.org%2Fwikipedia%2Fcommons%2Fthumb%2Fe%2Fe0%2FPlaceholder_icon_-_camera.svg%2F512px-Placeholder_icon_-_camera.svg.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <meta name="theme-color" content="#05050A">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Placeholder_icon_-_camera.svg/192px-Placeholder_icon_-_camera.svg.png">

    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- jsPDF Library for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Tailwind CSS (with preflight disabled so it doesn't break your custom CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: {
                preflight: false,
            }
        }
    </script>

    <style>
        /* 🎨 Premium Color System & Variables */
        :root {
            --bg-base: #05050A;
            --surface-glass: rgba(15, 15, 20, 0.65);
            --surface-overlay: rgba(20, 20, 25, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.15);
            
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            
            --shadow-soft: 0 10px 40px -10px rgba(0,0,0,0.5);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
            --radius-lg: 24px;
            --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            
            background: linear-gradient(-45deg, #0f0c29, #302b63, #05050A, #141028);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🔐 PIN SCREEN UI */
        #pin-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.5s ease, visibility 0.5s;
        }

        .pin-container { text-align: center; max-width: 350px; width: 100%; }
        .pin-icon { color: var(--primary); margin-bottom: 15px; }
        
        #pin-title { font-family: 'Outfit', sans-serif; font-size: 1.8rem; margin-bottom: 5px; }
        #pin-subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 30px; }

        .pin-dots { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
        .pin-dot {
            width: 16px; height: 16px; border-radius: 50%;
            border: 2px solid var(--border-glow); transition: var(--transition);
        }
        .pin-dot.active {
            background: var(--primary); border-color: var(--primary);
            box-shadow: var(--shadow-glow); transform: scale(1.2);
        }

        .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; justify-items: center; }
        .pin-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass);
            color: white; font-size: 1.8rem; font-family: 'Inter', sans-serif; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .pin-btn:active { background: rgba(255, 255, 255, 0.15); transform: scale(0.9); }
        .pin-btn.action { font-size: 1.2rem; background: transparent; border: none; box-shadow: none; }

        /* Error Shake Animation */
        .shake { animation: shakeError 0.4s ease-in-out; }
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .error-text { color: var(--danger) !important; }

        /* 📱 Main App Window */
        .app-container {
            width: 100%; max-width: 1050px; background: var(--surface-glass);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass); border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-soft); overflow: hidden; 
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; transform: scale(0.95);
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .app-container.unlocked { opacity: 1; pointer-events: all; transform: scale(1); }

        /* 📤 Upload Screen */
        #upload-container {
            padding: 80px 40px; text-align: center; display: flex; flex-direction: column;
            justify-content: center; align-items: center; min-height: 600px;
        }
        .upload-dropzone {
            border: 2px dashed var(--border-glow); border-radius: var(--radius-lg);
            padding: 60px 40px; width: 100%; max-width: 500px; background: rgba(0,0,0,0.2); transition: var(--transition);
        }
        .upload-dropzone:hover {
            border-color: var(--primary); background: rgba(99, 102, 241, 0.05); transform: scale(1.02); box-shadow: var(--shadow-glow);
        }
        .upload-icon { color: var(--primary); margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        #upload-container h2 { font-family: 'Outfit', sans-serif; font-size: 2rem; margin-bottom: 12px; }
        #upload-container p { color: var(--text-muted); margin-bottom: 30px; font-size: 1.05rem; }
        
        .upload-button {
            display: inline-flex; align-items: center; gap: 10px; padding: 14px 32px; background: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 1.1rem; font-family: 'Outfit', sans-serif; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .upload-button:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-glow); }
        #file-input { display: none; }
        
        /* 🖼️ Viewer Layout */
        #viewer-container { display: none; flex-direction: column; height: 85vh; max-height: 850px; }
        
        .viewer-header {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border-glass); background: rgba(0,0,0,0.3); z-index: 10;
        }
        .viewer-title { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 600; }
        .header-buttons { display: flex; align-items: center; gap: 10px; }
        
        .action-button {
            display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border: none; border-radius: 10px; font-size: 0.9rem; font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .add-button { background: rgba(255,255,255,0.08); color: white; border: 1px solid var(--border-glass); }
        .add-button:hover { background: rgba(255,255,255,0.15); }
        
        .download-button { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .download-button:hover { background: var(--success); color: white; }
        
        .clear-button { background: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
        .clear-button:hover { background: var(--danger); color: white; }

        /* Loader Spinner for Download */
        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 🚀 OPTIMIZED SWIPE TRACK */
        .main-image-wrapper {
            flex-grow: 1; background-color: #000; position: relative; overflow: hidden; cursor: grab; touch-action: none;
        }
        .main-image-wrapper:active { cursor: grabbing; }
        
        .swipe-track {
            display: flex; width: 300%; height: 100%; transform: translate3d(-33.333%, 0, 0); will-change: transform;
        }
        
        .slide { width: 33.333%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .slide img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; user-select: none; }

        .page-counter {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); color: white; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; font-family: 'Outfit', sans-serif; font-weight: 600; z-index: 5;
        }

        /* DETAILS OVERLAY */
        .details-overlay {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px;
            background: var(--surface-overlay); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glow); padding: 20px 24px; border-radius: 20px; color: white; z-index: 20; box-shadow: var(--shadow-soft); transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #details-display-view { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .text-content { flex-grow: 1; }
        
        #display-date { font-size: 0.85em; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        #display-description { font-family: 'Outfit', sans-serif; font-size: 1.3em; font-weight: 500; line-height: 1.4; }
        
        #edit-button {
            background: rgba(255,255,255,0.05); border-radius: 50%; border: 1px solid var(--border-glass); width: 48px; height: 48px; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: var(--transition);
        }
        #edit-button:hover { background: var(--primary); border-color: var(--primary); transform: rotate(10deg); }

        #details-edit-view { display: none; flex-direction: column; gap: 16px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.85em; margin-bottom: 8px; color: var(--text-muted); font-weight: 500; }
        
        .details-input {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 1em; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.3s;
        }
        .details-input:focus { border-color: var(--primary); background: rgba(0,0,0,0.5); }
        
        .edit-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }
        .edit-actions .action-button.primary { background: var(--primary); border: none; }
        .edit-actions .action-button.primary:hover { background: var(--primary-hover); }

        /* Dock-Style Thumbnails */
        .thumbnail-bar { flex-shrink: 0; background: rgba(0,0,0,0.6); padding: 16px 20px; border-top: 1px solid var(--border-glass); }
        .thumbnail-container { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; scroll-behavior: smooth; }
        .thumbnail-container::-webkit-scrollbar { height: 0px; } 
        
        .thumbnail-img {
            width: 65px; height: 65px; object-fit: cover; border-radius: 12px; cursor: pointer; border: 2px solid transparent; opacity: 0.4; transition: var(--transition); flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .thumbnail-img:hover { opacity: 0.8; transform: translateY(-4px); }
        .thumbnail-img.active { border-color: var(--primary); opacity: 1; transform: scale(1.15) translateY(-2px); box-shadow: var(--shadow-glow); }
        
        /* Mobile adjustments for header buttons */
        @media (max-width: 600px) {
            .action-button span { display: none; } /* Hide text on small screens */
            .action-button { padding: 10px; }
            .header-buttons { gap: 8px; }
        }
    </style>
</head>
<body>

    <!-- 🚀 Beautiful Tailwind PWA Install Button -->
    <!-- Positioned absolutely above the entire app with a high Z-Index so it stands out -->
    <button id="install-apk-btn" class="hidden fixed top-8 right-8 z-[9999] flex items-center justify-center gap-3 px-6 py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-full shadow-[0_10px_40px_-10px_rgba(99,102,241,0.8)] hover:scale-105 hover:shadow-[0_0_25px_rgba(99,102,241,0.6)] transition-all duration-300 font-[Outfit] font-semibold tracking-wide border border-white/20 backdrop-blur-md cursor-pointer outline-none">
        <svg class="text-white drop-shadow-md" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>

    <!-- 🔐 PIN LOCK SCREEN -->
    <div id="pin-screen">
        <div class="pin-container" id="pin-container">
            <svg class="pin-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <h2 id="pin-title">Set a 4-Digit PIN</h2>
            <p id="pin-subtitle">To keep your photos secure</p>

            <div class="pin-dots">
                <div class="pin-dot"></div><div class="pin-dot"></div>
                <div class="pin-dot"></div><div class="pin-dot"></div>
            </div>

            <div class="pin-pad">
                <button class="pin-btn" onclick="enterPin(1)">1</button>
                <button class="pin-btn" onclick="enterPin(2)">2</button>
                <button class="pin-btn" onclick="enterPin(3)">3</button>
                <button class="pin-btn" onclick="enterPin(4)">4</button>
                <button class="pin-btn" onclick="enterPin(5)">5</button>
                <button class="pin-btn" onclick="enterPin(6)">6</button>
                <button class="pin-btn" onclick="enterPin(7)">7</button>
                <button class="pin-btn" onclick="enterPin(8)">8</button>
                <button class="pin-btn" onclick="enterPin(9)">9</button>
                <button class="pin-btn action"></button>
                <button class="pin-btn" onclick="enterPin(0)">0</button>
                <button class="pin-btn action" onclick="deletePin()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 📱 MAIN APP -->
    <div class="app-container" id="app-container">
        <input type="file" id="file-input" accept="image/*" multiple>

        <div id="upload-container">
            <div class="upload-dropzone">
                <svg class="upload-icon" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <h2>Photo Library</h2>
                <p>High-quality offline viewing. Secured with PIN.</p>
                <label for="file-input" class="upload-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Select Photos
                </label>
            </div>

        <div id="viewer-container">

                <div class="viewer-title">Gallery View</div>
                <div class="header-buttons">

                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span>Add</span>
                    </label>
                    
                    <button id="download-pdf-button" class="action-button download-button">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

                    <button id="clear-gallery-button" class="action-button clear-button">

    <!-- Application Logic -->
    <script>
        // 🚀 --- PWA INSTALLATION LOGIC ---
        let deferredPrompt;
        const installApkBtn = document.getElementById('install-apk-btn');

        // Listen for the browser's install prompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later.
            deferredPrompt = e;
            // Reveal the beautiful Tailwind install button
            installApkBtn.classList.remove('hidden');
        });

        installApkBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Show the prompt natively
                deferredPrompt.prompt();
                // Wait for the user to respond to the prompt
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the APK/A2HS prompt');
                } else {
                    console.log('User dismissed the APK/A2HS prompt');
                }
                deferredPrompt = null;
                // Hide button after choice
                installApkBtn.classList.add('hidden');
            }
        });

        // Optional: Hide button immediately if already installed
        window.addEventListener('appinstalled', () => {
            installApkBtn.classList.add('hidden');
            console.log('PWA was installed successfully');
        });

        // 🔐 --- PIN LOCK LOGIC ---
        let currentPinInput = '';
        let setupTempPin = '';
        const savedAppPin = localStorage.getItem('proGalleryPin');
        let pinMode = savedAppPin ? 'unlock' : 'setup1'; 

        const pinTitle = document.getElementById('pin-title');
        const pinSubtitle = document.getElementById('pin-subtitle');
        const pinDots = document.querySelectorAll('.pin-dot');
        const pinContainer = document.getElementById('pin-container');
        const pinScreen = document.getElementById('pin-screen');
        const appContainer = document.getElementById('app-container');

        if(pinMode === 'unlock') {
            pinTitle.textContent = "Enter PIN";
            pinSubtitle.textContent = "Unlock your secure gallery";
        }

        function vibrate() {
            if(window.navigator && window.navigator.vibrate) navigator.vibrate(40);
        }

        function updateDots() {
            pinDots.forEach((dot, index) => {
                if (index < currentPinInput.length) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        window.enterPin = function(num) {
            vibrate();
            if (currentPinInput.length < 4) {
                currentPinInput += num;
                updateDots();
                if (currentPinInput.length === 4) {
                    setTimeout(processPin, 200); 
                }
            }
        }

        window.deletePin = function() {
            vibrate();
            if (currentPinInput.length > 0) {
                currentPinInput = currentPinInput.slice(0, -1);
                updateDots();
                pinTitle.classList.remove('error-text');
            }
        }

        function triggerError(msg) {
            pinContainer.classList.add('shake');
            pinTitle.classList.add('error-text');
            pinTitle.textContent = msg;
            if(window.navigator && window.navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            setTimeout(() => {
                pinContainer.classList.remove('shake');
                currentPinInput = '';
                updateDots();
            }, 500);
        }

        function processPin() {
            if (pinMode === 'unlock') {
                if (currentPinInput === savedAppPin) {
                    unlockApp();
                } else {
                    triggerError("Incorrect PIN");
                    setTimeout(() => {
                        pinTitle.textContent = "Enter PIN";
                        pinTitle.classList.remove('error-text');
                    }, 1000);
                }
            } 
            else if (pinMode === 'setup1') {
                setupTempPin = currentPinInput;
                currentPinInput = '';
                pinMode = 'setup2';
                pinTitle.textContent = "Confirm PIN";
                pinSubtitle.textContent = "Enter your PIN again";
                updateDots();
            } 
            else if (pinMode === 'setup2') {
                if (currentPinInput === setupTempPin) {
                    localStorage.setItem('proGalleryPin', currentPinInput);
                    unlockApp();
                } else {
                    triggerError("PINs do not match");
                    pinMode = 'setup1';
                    setupTempPin = '';
                    setTimeout(() => {
                        pinTitle.textContent = "Set a 4-Digit PIN";
                        pinTitle.classList.remove('error-text');
                        pinSubtitle.textContent = "To keep your photos secure";
                    }, 1000);
                }
            }
        }

        function unlockApp() {
            pinScreen.style.opacity = '0';
            setTimeout(() => { pinScreen.style.visibility = 'hidden'; }, 500);
            appContainer.classList.add('unlocked');
            initDB();
        }

        // 📱 --- MAIN GALLERY LOGIC ---
        const fileInput = document.getElementById('file-input');
        const uploadContainer = document.getElementById('upload-container');
        const viewerContainer = document.getElementById('viewer-container');
        const mainImageWrapper = document.getElementById('main-image-wrapper');
        const swipeTrack = document.getElementById('swipe-track');
        
        const imgPrev = document.getElementById('img-prev');
        const imgCurr = document.getElementById('img-curr');
        const imgNext = document.getElementById('img-next');

        const thumbnailContainer = document.getElementById('thumbnail-container');
        const pageCounter = document.getElementById('page-counter');
        const clearGalleryButton = document.getElementById('clear-gallery-button');
        const downloadPdfButton = document.getElementById('download-pdf-button');
        const detailsOverlay = document.getElementById('details-overlay');
        
        const detailsDisplayView = document.getElementById('details-display-view');
        const detailsEditView = document.getElementById('details-edit-view');
        const displayDateText = document.getElementById('date-text');
        const displayDescription = document.getElementById('display-description');
        const editButton = document.getElementById('edit-button');
        const cancelEditButton = document.getElementById('cancel-edit-button');
        const saveEditButton = document.getElementById('save-edit-button');
        const editDateInput = document.getElementById('edit-date-input');
        const editDescInput = document.getElementById('edit-desc-input');

        let uploadedImageObjects = []; 
        let currentIndex = 0;
        
        const DB_NAME = 'PhotoViewerDB';
        const STORE_NAME = 'ImageStore';
        let db;

        function getImageUrl(index) {
            if(index < 0 || index >= uploadedImageObjects.length) return '';
            const obj = uploadedImageObjects[index];
            if (!obj.url) obj.url = URL.createObjectURL(obj.file);
            return obj.url;
        }

        let isDragging = false, startPosX = 0, currentTranslate = 0, animationID;
        function getPositionX(event) { return event.type.includes('mouse') ? event.pageX : event.touches[0].clientX; }

        function updateSlides() {
            imgPrev.src = getImageUrl(currentIndex - 1);
            imgCurr.src = getImageUrl(currentIndex);
            imgNext.src = getImageUrl(currentIndex + 1);

            swipeTrack.style.transition = 'none';
            swipeTrack.style.transform = `translate3d(-33.333%, 0, 0)`;

            const currObj = uploadedImageObjects[currentIndex];
            if(currObj) {
                displayDateText.textContent = currObj.date;
                displayDescription.textContent = currObj.description;
            }
        }

        function dragStart(event) { 
            if(event.type === 'touchstart' && event.touches.length > 1) return;
            isDragging = true; startPosX = getPositionX(event); 
            swipeTrack.style.transition = 'none'; 
            detailsOverlay.style.opacity = '0';  
            detailsOverlay.style.transform = 'translate(-50%, 20px)';
            cancelAnimationFrame(animationID); animationLoop();
        }

        function animationLoop() {
            if(isDragging) {
                swipeTrack.style.transform = `translate3d(calc(-33.333% + ${currentTranslate}px), 0, 0)`;
                animationID = requestAnimationFrame(animationLoop);
            }
        }

        function dragMove(event) { 
            if (!isDragging) return;
            let moveX = getPositionX(event) - startPosX; 
            if (currentIndex === 0 && moveX > 0) moveX *= 0.3; 
            else if (currentIndex === uploadedImageObjects.length - 1 && moveX < 0) moveX *= 0.3;
            currentTranslate = moveX;
        }

        function dragEnd() {
            if(!isDragging) return;
            isDragging = false; cancelAnimationFrame(animationID);
            const threshold = window.innerWidth * 0.15; 
            
            if (currentTranslate < -threshold && currentIndex < uploadedImageObjects.length - 1) {
                swipeTrack.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                swipeTrack.style.transform = `translate3d(-66.666%, 0, 0)`;
                currentIndex++; setTimeout(finalizeSlide, 400);
            } else if (currentTranslate > threshold && currentIndex > 0) {
                swipeTrack.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                swipeTrack.style.transform = `translate3d(0%, 0, 0)`;
                currentIndex--; setTimeout(finalizeSlide, 400);
            } else {
                swipeTrack.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                swipeTrack.style.transform = `translate3d(-33.333%, 0, 0)`;
                detailsOverlay.style.opacity = '1'; detailsOverlay.style.transform = 'translate(-50%, 0)';
            }
            currentTranslate = 0;
        }

        function finalizeSlide() {
            updateSlides(); updateUI();
            detailsOverlay.style.opacity = '1'; detailsOverlay.style.transform = 'translate(-50%, 0)';
        }

        function displayImage(newIndex) {
            if (newIndex === currentIndex) return;
            const directionOffset = newIndex > currentIndex ? '-66.666%' : '0%';
            if (Math.abs(newIndex - currentIndex) > 1) {
                if (newIndex > currentIndex) imgNext.src = getImageUrl(newIndex);
                else imgPrev.src = getImageUrl(newIndex);
            }
            detailsOverlay.style.opacity = '0';
            swipeTrack.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
            swipeTrack.style.transform = `translate3d(${directionOffset}, 0, 0)`;
            currentIndex = newIndex; setTimeout(finalizeSlide, 400);
        }

        function initDB() {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
            request.onsuccess = e => { db = e.target.result; loadImagesFromDB(); };
        }
        
        function loadImagesFromDB() {
            if (!db) return;
            const request = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).getAll();
            request.onsuccess = () => { processImageData(request.result); };
        }

        async function addImagesToDB(files) {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const today = new Date().toISOString().split('T')[0];
            files.forEach(file => store.add({ file: file, date: today, description: 'Add a description...' }));
            return tx.complete;
        }

        async function updateImageDetailsInDB(id, newDetails) {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const getRequest = store.get(id);
            getRequest.onsuccess = () => {
                const data = getRequest.result;
                data.date = newDetails.date; data.description = newDetails.description;
                store.put(data);
            };
        }

        function processImageData(imageObjects) {
            uploadedImageObjects = imageObjects.reverse(); 
            if (uploadedImageObjects.length > 0) setupViewer(0);
        }
        
        function handleFileSelect(event) {
            const newFiles = Array.from(event.target.files);
            if (newFiles.length > 0) addImagesToDB(newFiles).then(() => { loadImagesFromDB(); });
            event.target.value = null;
        }

        function setupViewer(startIndex = 0) {
            if (uploadedImageObjects.length === 0) { 
                uploadContainer.style.display = 'flex'; viewerContainer.style.display = 'none'; return; 
            }
            uploadContainer.style.display = 'none'; viewerContainer.style.display = 'flex';
            currentIndex = startIndex; createThumbnails(); updateSlides(); updateUI();
            detailsOverlay.style.opacity = '1'; detailsOverlay.style.transform = 'translate(-50%, 0)';
        }

        function createThumbnails() {
            thumbnailContainer.innerHTML = ''; let i = 0;
            function loadBatch() {
                const batchLimit = Math.min(i + 15, uploadedImageObjects.length);
                for (; i < batchLimit; i++) {
                    const thumb = document.createElement('img');
                    thumb.src = getImageUrl(i); thumb.classList.add('thumbnail-img'); thumb.dataset.index = i;
                    if (i === currentIndex) thumb.classList.add('active');
                    let idx = i; thumb.addEventListener('click', () => displayImage(idx));
                    thumbnailContainer.appendChild(thumb);
                }
                if (i < uploadedImageObjects.length) requestAnimationFrame(loadBatch); 
            }
            loadBatch();
        }
        
        function updateUI() {
            pageCounter.textContent = `${currentIndex + 1} / ${uploadedImageObjects.length}`;
            document.querySelectorAll('.thumbnail-img').forEach((thumb) => {
                const idx = parseInt(thumb.dataset.index);
                thumb.classList.toggle('active', idx === currentIndex);
                if (idx === currentIndex) thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });
        }
        
        function clearGallery() {
            if (confirm("Are you sure you want to permanently delete all photos?")) {
                const request = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).clear();
                request.onsuccess = () => { uploadedImageObjects = []; setupViewer(0); };
            }
        }

        function showEditView() {
            const currentObj = uploadedImageObjects[currentIndex];
            editDateInput.value = currentObj.date; editDescInput.value = currentObj.description;
            detailsDisplayView.style.display = 'none'; detailsEditView.style.display = 'flex';
        }

        function showDisplayView() {
            detailsDisplayView.style.display = 'flex'; detailsEditView.style.display = 'none';
        }

        function saveDetails() {
            const currentObj = uploadedImageObjects[currentIndex];
            const newDetails = { date: editDateInput.value, description: editDescInput.value };
            updateImageDetailsInDB(currentObj.id, newDetails);
            currentObj.date = newDetails.date; currentObj.description = newDetails.description;
            displayDateText.textContent = newDetails.date; displayDescription.textContent = newDetails.description;
            showDisplayView();
        }

        // 📄 --- PDF GENERATION LOGIC ---
        async function exportToPDF() {
            if (uploadedImageObjects.length === 0) return;
            
            const originalHTML = downloadPdfButton.innerHTML;
            downloadPdfButton.innerHTML = '<span class="spinner"></span> <span>Wait...</span>';
            downloadPdfButton.disabled = true;

            try {
                if (!window.jspdf) throw new Error("PDF Library is still loading...");
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4'); 
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                for (let i = 0; i < uploadedImageObjects.length; i++) {
                    if (i > 0) pdf.addPage();
                    
                    const obj = uploadedImageObjects[i];
                    
                    const img = new Image();
                    img.src = getImageUrl(i);
                    await new Promise(resolve => { img.onload = resolve; });

                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1200;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > MAX_WIDTH) {
                        height = height * (MAX_WIDTH / width);
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const imgData = canvas.toDataURL('image/jpeg', 0.7); 

                    const margin = 15;
                    const maxPdfImgWidth = pageWidth - (margin * 2);
                    const maxPdfImgHeight = pageHeight - 60; 
                    
                    let pdfImgWidth = maxPdfImgWidth;
                    let pdfImgHeight = (height * maxPdfImgWidth) / width;
                    
                    if (pdfImgHeight > maxPdfImgHeight) {
                        pdfImgHeight = maxPdfImgHeight;
                        pdfImgWidth = (width * maxPdfImgHeight) / height;
                    }
                    
                    const xPos = (pageWidth - pdfImgWidth) / 2;
                    pdf.addImage(imgData, 'JPEG', xPos, margin, pdfImgWidth, pdfImgHeight);
                    
                    pdf.setFontSize(12);
                    pdf.setTextColor(100);
                    pdf.text(`Date: ${obj.date}`, margin, pageHeight - 35);
                    
                    pdf.setFontSize(16);
                    pdf.setTextColor(20);
                    const splitDesc = pdf.splitTextToSize(`Details: ${obj.description}`, maxPdfImgWidth);
                    pdf.text(splitDesc, margin, pageHeight - 25);
                }

                pdf.save("Pro_Gallery_Export.pdf");

            } catch (error) {
                console.error(error);
                alert("Error generating PDF. Make sure you have internet access to load the PDF library.");
            } finally {
                downloadPdfButton.innerHTML = originalHTML;
                downloadPdfButton.disabled = false;
            }
        }

        fileInput.addEventListener('change', handleFileSelect);
        clearGalleryButton.addEventListener('click', clearGallery);
        downloadPdfButton.addEventListener('click', exportToPDF); 
        
        document.addEventListener('keydown', e => {
            if(viewerContainer.style.display === 'flex') {
                if (e.key === 'ArrowLeft' && currentIndex > 0) displayImage(currentIndex - 1);
                else if (e.key === 'ArrowRight' && currentIndex < uploadedImageObjects.length - 1) displayImage(currentIndex + 1);
            }
        });

        mainImageWrapper.addEventListener('mousedown', dragStart); mainImageWrapper.addEventListener('mousemove', dragMove);
        mainImageWrapper.addEventListener('mouseup', dragEnd); mainImageWrapper.addEventListener('mouseleave', dragEnd);
        mainImageWrapper.addEventListener('touchstart', dragStart, { passive: false });
        mainImageWrapper.addEventListener('touchmove', (e) => { if(isDragging) { e.preventDefault(); dragMove(e); } }, { passive: false });
        mainImageWrapper.addEventListener('touchend', dragEnd);
        
        editButton.addEventListener('click', showEditView);
        cancelEditButton.addEventListener('click', showDisplayView);
        saveEditButton.addEventListener('click', saveDetails);

    </script>
</body>
</html>
