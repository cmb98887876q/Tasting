<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Video Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: rgba(22, 27, 34, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-glow: rgba(239, 68, 68, 0.15);
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --success: #22c55e;
            --error: #ef4444;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.06) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeInDown 0.6s ease-out;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Glass Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            animation: fadeInUp 0.6s ease-out;
            margin-bottom: 20px;
        }

        /* Input Group */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .url-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 110px 14px 16px;
            font-size: 0.95rem;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
            background: rgba(13, 17, 23, 0.9);
        }

        input[type="text"]::placeholder {
            color: var(--text-secondary);
        }

        .input-actions {
            position: absolute;
            right: 6px;
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Error Banner */
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease-in-out;
        }

        .error-msg.visible {
            display: flex;
        }

        /* Action Buttons Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            width: 100%;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .full-width {
            grid-column: span 2;
        }

        /* Player Container Section */
        .player-container-wrapper {
            margin-top: 20px;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--card-border);
            display: none;
            position: relative;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .player-container-wrapper.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 16px; }
            .actions-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Streamlined Player
            </div>
            <h1>External Video Player</h1>
            <p class="subtitle">Paste a YouTube link to embed, copy, or launch in external apps</p>
        </header>

        <div class="card">
            <div class="input-group">
                <div class="url-input-wrapper">
                    <input type="text" id="urlInput" placeholder="Paste YouTube URL (e.g., youtu.be/... or watch?v=...)" autocomplete="off">
                    <div class="input-actions">
                        <button class="icon-btn" id="pasteBtn" title="Paste from clipboard">
                            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v3h10V5h2v14z"/></svg>
                        </button>
                        <button class="icon-btn" id="clearBtn" title="Clear input">
                            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="error-msg" id="errorMsg">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 s1zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span id="errorText">Please enter a valid YouTube video link.</span>
            </div>

            <div class="actions-grid">
                <button class="btn btn-primary" id="playEmbedBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    Play Embedded
                </button>
                <button class="btn btn-secondary" id="openExternalBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                    Open External
                </button>
                <button class="btn btn-secondary full-width" id="copyUrlBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copy Video URL
                </button>
            </div>

            <div class="player-container-wrapper" id="playerWrapper">
                <div id="playerContainer"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 External Video Player. Built with HTML, CSS & Vanilla JS.</p>
    </footer>

    <div class="toast" id="toastNotification">Action successful</div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const pasteBtn = document.getElementById('pasteBtn');
        const clearBtn = document.getElementById('clearBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const playEmbedBtn = document.getElementById('playEmbedBtn');
        const openExternalBtn = document.getElementById('openExternalBtn');
        const copyUrlBtn = document.getElementById('copyUrlBtn');
        const playerWrapper = document.getElementById('playerWrapper');
        const playerContainer = document.getElementById('playerContainer');
        const toastNotification = document.getElementById('toastNotification');

        function showToast(message) {
            toastNotification.textContent = message;
            toastNotification.classList.add('show');
            setTimeout(() => {
                toastNotification.classList.remove('show');
            }, 2500);
        }

        function showError(message) {
            errorText.textContent = message;
            errorMsg.classList.add('visible');
        }

        function hideError() {
            errorMsg.classList.remove('visible');
        }

        function extractVideoId(url) {
            if (!url) return null;
            let videoId = null;
            
            // Standard / short / embed formats
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);

            if (match && match[2].length === 11) {
                videoId = match[2];
            } else {
                // Check if the input itself is just an 11-character video ID
                const cleanInput = url.trim();
                if (/^[a-zA-Z0-9_-]{11}$/.test(cleanInput)) {
                    videoId = cleanInput;
                }
            }
            return videoId;
        }

        function getValidatedVideoId() {
            const rawUrl = urlInput.value.trim();
            if (!rawUrl) {
                showError("Please enter a YouTube video URL.");
                return null;
            }
            const videoId = extractVideoId(rawUrl);
            if (!videoId) {
                showError("Invalid YouTube link format. Please check and try again.");
                return null;
            }
            hideError();
            return videoId;
        }

        // Paste action
        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    urlInput.value = text;
                    hideError();
                    showToast("URL pasted from clipboard");
                }
            } catch (err) {
                showError("Clipboard permission denied or unavailable.");
            }
        });

        // Clear action
        clearBtn.addEventListener('click', () => {
            urlInput.value = '';
            hideError();
            playerWrapper.classList.remove('active');
            playerContainer.innerHTML = '';
        });

        // Play Embedded action
        playEmbedBtn.addEventListener('click', () => {
            const videoId = getValidatedVideoId();
            if (!videoId) return;

            playerWrapper.classList.add('active');
            playerContainer.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            showToast("Loading embedded player");
        });

        // Open External action
        openExternalBtn.addEventListener('click', () => {
            const videoId = getValidatedVideoId();
            if (!videoId) return;

            const standardUrl = `https://www.youtube.com/watch?v=${videoId}`;
            const appUrl = `vnd.youtube://${videoId}`;

            // Check if mobile or general external support
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const isAndroid = /Android/.test(navigator.userAgent);

            if (isAndroid || isIOS) {
                // Attempt launching mobile scheme fallback to web
                window.location.href = appUrl;
                setTimeout(() => {
                    window.open(standardUrl, '_blank');
                }, 500);
            } else {
                window.open(standardUrl, '_blank');
            }
            showToast("Opening external player / app");
        });

        // Copy URL action
        copyUrlBtn.addEventListener('click', async () => {
            const videoId = getValidatedVideoId();
            if (!videoId) return;

            const cleanUrl = `https://www.youtube.com/watch?v=${videoId}`;
            try {
                await navigator.clipboard.writeText(cleanUrl);
                showToast("Video URL copied to clipboard!");
            } catch (err) {
                showError("Failed to copy URL.");
            }
        });

        // Live validation clearing on input
        urlInput.addEventListener('input', () => {
            if (errorMsg.classList.contains('visible')) {
                hideError();
            }
        });
    </script>
</body>
</html>
